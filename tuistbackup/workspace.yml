# xcodegen workspace (historical layout).
# The SC* workflows often do per-directory "xcodegen generate" for a specific layer
# rather than requiring the full workspace, but this file mirrors the pre-Tuist
# generator configuration for anyone who wants to generate everything together.

name: ScaleCloud
projects:
  - ScaleCloudWrap/project.yml
  - ScaleCloudApp/project.yml
  - ScaleCloudKit/project.yml
  - ScaleCloudGo/project.yml