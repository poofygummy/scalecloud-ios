name: ScaleCloudSign
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
targets:
  ScaleCloudSign:
    type: framework
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Resources
        type: folder
        buildPhase: resources
      - path: Sources
        excludes:
          - "**/Info.plist"
          - "**/Makefile.am"
          - "**/Makefile.in"
          - "**/.gitignore"
          - "**/.gitkeep"
          - "**/README*"
          - "**/LICENSE*"
          - "**/*.md"
          - "**/autogen.sh"
          - "**/configure*"
          - "**/config.h.in"
          - "**/*.pc.in"
          - "AltSign/include"
          - "AltSign/ldid/libplist/src/plist.h"
    settings:
      base:
        SKIP_INSTALL: "NO"
        BUILD_LIBRARY_FOR_DISTRIBUTION: "YES"
        DEFINES_MODULE: "YES"
        PRODUCT_MODULE_NAME: "ScaleCloudSign"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../ScaleCloudGo/prebuilt $(SRCROOT)/../ScaleCloudKit/prebuilt"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Sources/AltSign/include $(SRCROOT)/Sources/AltSign/ldid $(SRCROOT)/Sources/AltSign/ldid/libplist/include"
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -w"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) unix=1"
    dependencies:
      - framework: ../ScaleCloudGo/prebuilt/ScaleCloudGo.xcframework
        embed: false
      - framework: ../ScaleCloudKit/prebuilt/ScaleCloudKit.framework
        embed: false
      - package: Starscream
      - sdk: UIKit.framework
packages:
  Starscream:
    url: https://github.com/daltoniam/Starscream
    from: 4.0.0
