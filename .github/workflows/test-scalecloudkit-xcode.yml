name: Build ScalecloudKit iOS framework

on:
  workflow_dispatch: {}

jobs:
  build-my-modified-xcode:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build my modified ScalecloudKit (local fork) with Xcode
        run: |
          set -e
          cd ScalecloudKit

          # Resolve SPM dependencies
          xcodebuild -resolvePackageDependencies \
            -scheme ScalecloudKit \
            -destination 'generic/platform=iOS'

          # Create an xcarchive for a deterministic product path
          ARCHIVE_PATH="$PWD/build/ScalecloudKit.xcarchive"
          mkdir -p "$(dirname "$ARCHIVE_PATH")"

          xcodebuild archive \
            -scheme ScaleCloudKit \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            | tee build.log || true

      - name: Package the built ScalecloudKit framework into an XCFramework and zip
        run: |
          set -e
          cd ScalecloudKit

          ARCHIVE_PATH="$PWD/build/ScalecloudKit.xcarchive"
          SIM_ARCHIVE_PATH="$PWD/build/ScalecloudKit-sim.xcarchive"

          # Ensure simulator archive exists (may fail on some runners, continue)
          xcodebuild archive \
            -scheme ScalecloudKit \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -archivePath "$SIM_ARCHIVE_PATH" \
            SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES || true

          DEVICE_FRAMEWORK="$ARCHIVE_PATH/Products/Library/Frameworks/ScalecloudKit.framework"
          SIM_FRAMEWORK="$SIM_ARCHIVE_PATH/Products/Library/Frameworks/ScalecloudKit.framework"

          mkdir -p "$PWD/build"
          mkdir -p ../artifacts

          if [ -d "$DEVICE_FRAMEWORK" ] && [ -d "$SIM_FRAMEWORK" ]; then
            xcodebuild -create-xcframework \
              -framework "$DEVICE_FRAMEWORK" \
              -framework "$SIM_FRAMEWORK" \
              -output "$PWD/build/ScalecloudKit.xcframework"
            cd build
            zip -r ScalecloudKit.xcframework.zip ScalecloudKit.xcframework
            mv ScalecloudKit.xcframework.zip ../artifacts/
            cd -
            echo "Created XCFramework and zipped to ../artifacts/ScalecloudKit.xcframework.zip"
          elif [ -d "$DEVICE_FRAMEWORK" ]; then
            # Fallback: package single framework
            cp -R "$DEVICE_FRAMEWORK" "$PWD/build/"
            cd build
            zip -r ScalecloudKit.framework.zip ScalecloudKit.framework
            mv ScalecloudKit.framework.zip ../artifacts/
            cd -
            echo "Packaged device framework to ../artifacts/ScalecloudKit.framework.zip"
          else
            echo "Could not find built frameworks in archive paths"
            echo "Checked: $DEVICE_FRAMEWORK"
            echo "Checked: $SIM_FRAMEWORK"
            find "$PWD" -maxdepth 4 -type d -name "*ScalecloudKit*" | head -40
            exit 1
          fi
