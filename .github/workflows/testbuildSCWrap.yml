name: Build ScaleCloudWrap

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Check App prebuilt exists
        run: |
          if [ ! -d "ScaleCloudApp/prebuilt" ]; then
            echo "ERROR: ScaleCloudApp/prebuilt/ missing. Download ScaleCloudApp-prebuilt artifact first."
            exit 1
          fi

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Generate project with xcodegen
        run: |
          brew install xcodegen
          cd ScaleCloudWrap
          xcodegen generate

      - name: Build
        run: |
          cd ScaleCloudWrap
          xcodebuild archive \
            -scheme ScaleCloudWrap \
            -destination 'generic/platform=iOS' \
            -archivePath build/Wrap.xcarchive

      - name: Upload prebuilt
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudWrap-prebuilt
          path: ScaleCloudWrap/build/
          retention-days: 7
          
