name: Build ScaleCloudRenew

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Init submodules (non-recursive)
        run: git submodule update --init
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Checkout ScaleCloudSign submodule (for ScaleCloudSign prebuilt)
        run: git submodule update --init -- ScaleCloudSign

      - name: Check prebuilts exist
        run: |
          if [ ! -d "ScaleCloudGo/prebuilt" ]; then
            echo "ERROR: ScaleCloudGo/prebuilt/ missing. Run ScaleCloudGo workflow first."
            exit 1
          fi
          if [ ! -d "ScaleCloudKit/prebuilt" ]; then
            echo "ERROR: ScaleCloudKit/prebuilt/ missing. Run ScaleCloudKit workflow first."
            exit 1
          fi
          if [ ! -d "ScaleCloudSign/prebuilt" ]; then
            echo "ERROR: ScaleCloudSign/prebuilt/ missing. Run ScaleCloudSign workflow first."
            exit 1
          fi

      - name: Install xcodegen
        run: |
          curl -L https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip -o xcodegen.zip
          unzip xcodegen.zip
          sudo mv xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          cd ScaleCloudRenew
          xcodegen generate

      - name: Build and extract XCFramework
        run: |
          cd ScaleCloudRenew
          mkdir -p prebuilt
          WS=${{ github.workspace }}

          # Archive for iOS device (arm64)
          xcodebuild archive \
            -scheme ScaleCloudRenew \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -archivePath build/ios.xcarchive \
            -derivedDataPath build \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            FRAMEWORK_SEARCH_PATHS="$WS/ScaleCloudSign/prebuilt $WS/ScaleCloudGo/prebuilt $WS/ScaleCloudKit/prebuilt $WS/ScaleCloudRenew/Sources/RustBridge/lib $WS/ScaleCloudSign/Dependencies/OpenSSL.xcframework/ios-arm64" \
            OTHER_SWIFT_FLAGS="-suppress-warnings -Xcc -fpermissive -Xcc -fmodule-map-file=$WS/ScaleCloudSign/Dependencies/corecrypto/include/module.modulemap -Xcc -fmodule-map-file=$WS/ScaleCloudSign/ScaleCloudSign/include/module.modulemap -Xcc -I$WS/ScaleCloudSign/Dependencies/corecrypto/include -Xcc -I$WS/ScaleCloudSign/ScaleCloudSign/include"

          # Locate the archived framework
          FW=$(find build/ios.xcarchive -type d -name "ScaleCloudRenew.framework" | head -1)
          if [ -z "$FW" ]; then
            echo "ERROR: ScaleCloudRenew.framework not found in archive"
            find build/ios.xcarchive -name "*.framework" -o -name "*.a"
            exit 1
          fi
          echo "Found framework at: $FW"

          # Create XCFramework from the archived framework
          xcodebuild -create-xcframework \
            -framework "$FW" \
            -output prebuilt/ScaleCloudRenew.xcframework

      - name: Upload prebuilt
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudRenew-prebuilt
          path: |
            ScaleCloudRenew/prebuilt/
            ScaleCloudRenew/ScaleCloudRenew.xcodeproj/
          retention-days: 7
