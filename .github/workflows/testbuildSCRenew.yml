name: Build ScaleCloudRenew

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_PAT }}
          lfs: false
      - name: Init required submodules
        run: git submodule update --init -- ScaleCloudGo ScaleCloudKit ScaleCloudRenew ScaleCloudDeps

      - name: Clean previous prebuilt
        run: |
          rm -rf ScaleCloudRenew/prebuilt/ScaleCloudRenew.framework
          rm -rf ScaleCloudRenew/prebuilt/ScaleCloudRenew.xcframework

      - name: Init ScaleCloudSign submodule (recursive for ldid)
        run: git submodule update --init --recursive -- ScaleCloudSign

      - name: Check prebuilts exist
        run: |
          if [ ! -d "ScaleCloudGo/prebuilt" ]; then
            echo "ERROR: ScaleCloudGo/prebuilt/ missing. Run ScaleCloudGo workflow first."
            exit 1
          fi
          if [ ! -d "ScaleCloudKit/prebuilt" ]; then
            echo "ERROR: ScaleCloudKit/prebuilt/ missing. Run ScaleCloudKit workflow first."
            exit 1
          fi
          if [ ! -d "ScaleCloudSign/prebuilt" ]; then
            echo "ERROR: ScaleCloudSign/prebuilt/ missing. Run ScaleCloudSign workflow first."
            exit 1
          fi
          if [ ! -d "ScaleCloudDeps/prebuilt" ]; then
            echo "ERROR: ScaleCloudDeps/prebuilt/ missing. Run testbuildSCDeps first."
            exit 1
          fi

      - name: Generate Xcode project with xcodegen
        run: |

      - name: Install xcodegen
        run: |
          curl -L https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip -o xcodegen.zip
          unzip xcodegen.zip
          sudo mv xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          cd ScaleCloudRenew
          xcodegen generate

      - name: Build and extract framework
        run: |
          cd ScaleCloudRenew
          mkdir -p prebuilt
          WS=${{ github.workspace }}
          xcodebuild build \
            -scheme ScaleCloudRenew \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            DYLIB_INSTALL_NAME_BASE=@rpath \
            PRODUCT_BUNDLE_IDENTIFIER=com.scalecloud.ScaleCloudRenew \
            FRAMEWORK_SEARCH_PATHS="$WS/ScaleCloudSign/prebuilt $WS/ScaleCloudGo/prebuilt $WS/ScaleCloudKit/prebuilt $WS/ScaleCloudDeps/prebuilt $WS/ScaleCloudRenew/Sources/RustBridge/lib $WS/ScaleCloudSign/Dependencies/OpenSSL.xcframework/ios-arm64" \
            OTHER_SWIFT_FLAGS="-suppress-warnings -Xcc -fpermissive -Xcc -fmodule-map-file=$WS/ScaleCloudSign/Dependencies/corecrypto/include/module.modulemap -Xcc -fmodule-map-file=$WS/ScaleCloudSign/ScaleCloudSign/include/module.modulemap -Xcc -I$WS/ScaleCloudSign/Dependencies/corecrypto/include -Xcc -I$WS/ScaleCloudSign/ScaleCloudSign/include"
          
          # Copy framework from build products
          FW=$(find build/Build/Products -type d -name "ScaleCloudRenew.framework" | head -1)
          if [ -z "$FW" ]; then
            echo "ERROR: ScaleCloudRenew.framework not found in build products"
            find build -name "*.framework" -o -name "*.a"
            exit 1
          fi
          echo "Found framework at: $FW"
          cp -R "$FW" prebuilt/

      - name: Fix CFBundleIdentifier in Info.plist
        run: |
          PLIST=ScaleCloudRenew/prebuilt/ScaleCloudRenew.framework/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.scalecloud.ScaleCloudRenew" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.scalecloud.ScaleCloudRenew" "$PLIST"
          echo "Bundle ID is now: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"

      - name: Wrap into XCFramework
        run: |
          xcodebuild -create-xcframework \
            -framework ScaleCloudRenew/prebuilt/ScaleCloudRenew.framework \
            -output ScaleCloudRenew/prebuilt/ScaleCloudRenew.xcframework
          # Remove intermediate .framework — only .xcframework is needed by the app
          rm -rf ScaleCloudRenew/prebuilt/ScaleCloudRenew.framework

      - name: Stage artifact
        run: |
          mkdir -p /tmp/artifact/prebuilt
          cp -R ScaleCloudRenew/prebuilt/ /tmp/artifact/prebuilt/
          cp -R ScaleCloudRenew/ScaleCloudRenew.xcodeproj /tmp/artifact/ScaleCloudRenew.xcodeproj

      - name: Push prebuilt to subrepo
        run: |
          cd ScaleCloudRenew
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.SUBMODULES_PAT }}@github.com/poofygummy/ScaleCloudRenew.git
          git add prebuilt/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update prebuilt [ci skip]"
          git push origin HEAD:main

      - name: Update monorepo submodule pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.SUBMODULES_PAT }}@github.com/poofygummy/scalecloud-ios.git
          git add ScaleCloudRenew
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update ScaleCloudRenew submodule pointer [ci skip]"
          git push origin HEAD:main

      - name: Upload prebuilt
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudRenew-prebuilt
          path: /tmp/artifact/
          retention-days: 7
