name: Build ScaleCloudRenew

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Init submodules (non-recursive)
        run: git submodule update --init
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Check Go and Kit prebuilt exist
        run: |
          if [ ! -d "ScaleCloudGo/prebuilt" ]; then
            echo "ERROR: ScaleCloudGo/prebuilt/ missing. Run ScaleCloudGo workflow first."
            exit 1
          fi
          if [ ! -d "ScaleCloudKit/prebuilt" ]; then
            echo "ERROR: ScaleCloudKit/prebuilt/ missing. Run ScaleCloudKit workflow first."
            exit 1
          fi

      - name: Cache iOS platform SDK
        id: cache-ios-sdk
        uses: actions/cache@v4
        with:
          path: /Applications/Xcode_15.4.app/Contents/Developer/Platforms/iPhoneOS.platform
          key: ios-sdk-xcode-15.4

      - name: Install iOS platform SDK
        if: steps.cache-ios-sdk.outputs.cache-hit != 'true'
        run: |
          sudo xcodebuild -downloadPlatform iOS
          
      - name: Generate Xcode project with xcodegen
        run: |

      - name: Install xcodegen
        run: |
          curl -L https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip -o xcodegen.zip
          unzip xcodegen.zip
          sudo mv xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          cd ScaleCloudRenew
          xcodegen generate

      - name: Build and extract framework
        run: |
          cd ScaleCloudRenew
          mkdir -p prebuilt
          xcodebuild build \
            -scheme ScaleCloudRenew \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES
          
          # Copy framework from build products
          FW=$(find build/Build/Products -type d -name "ScaleCloudRenew.framework" | head -1)
          if [ -z "$FW" ]; then
            echo "ERROR: ScaleCloudRenew.framework not found in build products"
            find build -name "*.framework" -o -name "*.a"
            exit 1
          fi
          echo "Found framework at: $FW"
          cp -R "$FW" prebuilt/

      - name: Upload prebuilt
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudRenew-prebuilt
          path: |
            ScaleCloudRenew/prebuilt/
            ScaleCloudRenew/ScaleCloudRenew.xcodeproj/
          retention-days: 7
