name: Build SCGo iOS Framework

on:
  workflow_dispatch:   # Manual trigger from GitHub UI
  push:
    paths:
      - 'SCgo.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-scgo-framework.yml'

jobs:
  build-framework:
    runs-on: macos-14   # Apple Silicon runner (better for modern Go + gomobile)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'   # Matches your go.mod

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

      - name: Build iOS XCFramework
        run: |
          gomobile bind -target=ios -o SCGo.xcframework .

      - name: Zip the framework (for easy backup/download)
        run: |
          zip -r SCGo.xcframework.zip SCGo.xcframework

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCGo-xcframework
          path: SCGo.xcframework
          retention-days: 30

      - name: Upload Zip artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: SCGo-xcframework-zip
          path: SCGo.xcframework.zip
          retention-days: 30
