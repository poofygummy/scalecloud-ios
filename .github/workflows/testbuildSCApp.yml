name: Build ScaleCloudApp

on:
  workflow_dispatch:
    inputs:
      kit_run_id:
        description: 'GitHub run-id of a prior "Build ScaleCloudKit" workflow that published ScaleCloudKit-prebuilt (NextcloudKit.framework). Leave empty to regenerate the chain in this run.'
        required: false
        type: string
      publish_prebuilt:
        description: 'Publish a clean ScaleCloudApp build artifact for Wrap or ad-hoc distribution'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: macos-14
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
    
      - name: Checkout
        uses: actions/checkout@v4

      # --- Optional individual-layer handoff: download ScaleCloudKit prebuilt artifact ---
      # Placing the artifact contents under ScaleCloudKit/prebuilt/ lets the adapted
      # ScaleCloudApp/ScaleCloudApp.xcodeproj consume it via:
      #   - PBXFileReference path = ../ScaleCloudKit/prebuilt/NextcloudKit.framework
      #   - FRAMEWORK_SEARCH_PATHS = .../ScaleCloudKit/prebuilt
      # No Go sources or NextcloudKit SPM package resolution are required when this is present.
      - name: Download and materialize ScaleCloudKit prebuilt from prior run
        if: ${{ github.event.inputs.kit_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.inputs.kit_run_id }}
          name: ScaleCloudKit-prebuilt
          path: ScaleCloudKit/prebuilt-download
      - name: Place downloaded Kit prebuilt into repo tree (prebuilt/NextcloudKit.framework)
        if: ${{ github.event.inputs.kit_run_id != '' }}
        run: |
          mkdir -p ScaleCloudKit/prebuilt
          rsync -a ScaleCloudKit/prebuilt-download/ ScaleCloudKit/prebuilt/ || cp -a ScaleCloudKit/prebuilt-download/. ScaleCloudKit/prebuilt/
          # The App pbxproj expects the directory "NextcloudKit.framework" (name chosen to keep
          # import compatibility with the many dozens of "import NextcloudKit" statements inherited
          # from upstream nextcloud/ios without any source changes in iOSClient/ or Brand/).
          ls -lR ScaleCloudKit/prebuilt/ | head -30
          echo "ScaleCloudKit prebuilt materialized from run ${{ github.event.inputs.kit_run_id }}"

      - name: Set up Go
        # Only strictly required when we are rebuilding the Go layer (kit_run_id was not supplied).
        if: ${{ github.event.inputs.kit_run_id == '' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: 'ScaleCloudGo/go.sum'

      - name: Provision tools
        run: |
          brew install xcodegen
          # gomobile is only needed if we are asked to rebuild Go inside this run.
          if [ "${{ github.event.inputs.kit_run_id }}" = "" ]; then
            go install golang.org/x/mobile/cmd/gomobile@latest
            go install golang.org/x/mobile/cmd/gobind@latest
            gomobile init
          fi

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      # Generate prerequisites in order (project refs will chain).
      # When a prebuilt was materialized above these steps are essentially no-ops or
      # serve only to produce the small project metadata for any tooling that still
      # walks the xcodegen graph; the real linkage for the App target is the edited
      # ScaleCloudApp.xcodeproj (upstream pbxproj + our narrow prebuilt swap edits).
      - name: Generate ScaleCloudGo project
        if: ${{ github.event.inputs.kit_run_id == '' }}
        working-directory: ScaleCloudGo
        run: xcodegen generate

      - name: Generate ScaleCloudKit project
        if: ${{ github.event.inputs.kit_run_id == '' }}
        working-directory: ScaleCloudKit
        run: xcodegen generate

      - name: Generate ScaleCloudApp project
        working-directory: ScaleCloudApp
        run: xcodegen generate

      - name: Build ScaleCloudApp
        working-directory: ScaleCloudApp
        run: |
          # Prefer the explicit project when it exists (the adapted upstream pbxproj).
          # This is the maximally-compatible path: the pbxproj already carries the
          # full dep surface (RealmSwift, MobileVLCKit, LucidBanner, etc.) that the old
          # Tuist Project.swift glob approach could not express without duplication.
          if [ -f ScaleCloudApp/ScaleCloudApp.xcodeproj/project.pbxproj ]; then
            xcodebuild archive \
              -project ScaleCloudApp/ScaleCloudApp.xcodeproj \
              -scheme Nextcloud \
              -destination 'generic/platform=iOS' \
              -archivePath "$PWD/build/ScaleCloudApp.xcarchive"
          else
            xcodebuild archive \
              -scheme ScaleCloudApp \
              -destination 'generic/platform=iOS' \
              -archivePath "$PWD/build/ScaleCloudApp.xcarchive"
          fi

      - name: Upload xcarchive artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudApp-xcarchive
          path: ScaleCloudApp/build/ScaleCloudApp.xcarchive
          retention-days: 1

      - name: Upload prebuilt-style app artifact (for Wrap or distribution)
        if: ${{ github.event.inputs.publish_prebuilt == 'true' || github.event.inputs.publish_prebuilt == true || github.event.inputs.publish_prebuilt == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudApp-prebuilt
          path: ScaleCloudApp/build/ScaleCloudApp.xcarchive
          retention-days: 1

