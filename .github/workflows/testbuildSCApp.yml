name: Build ScaleCloudApp

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
    
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: 'ScaleCloudGo/go.sum'

      - name: Provision tools
        run: |
          brew install xcodegen
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      # Generate prerequisites in order (project refs will chain)
      - name: Generate ScaleCloudGo project
        working-directory: ScaleCloudGo
        run: xcodegen generate

      - name: Generate ScaleCloudKit project
        working-directory: ScaleCloudKit
        run: xcodegen generate

      - name: Generate ScaleCloudApp project
        working-directory: ScaleCloudApp
        run: xcodegen generate

      - name: Build ScaleCloudApp
        working-directory: ScaleCloudApp
        run: |
          xcodebuild archive \
            -scheme ScaleCloudApp \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ScaleCloudApp.xcarchive"

      - name: Upload artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudApp-xcarchive
          path: ScaleCloudApp/build/ScaleCloudApp.xcarchive
          retention-days: 1

