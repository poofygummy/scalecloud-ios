name: Build ScaleCloudApp

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_PAT }}
          lfs: true

      - name: Init required submodules
        run: git submodule update --init -- ScaleCloudApp ScaleCloudGo ScaleCloudKit ScaleCloudSign ScaleCloudRenew ScaleCloudBanner

      - name: Clean previous prebuilt
        run: rm -rf ScaleCloudApp/prebuilt

      - name: Check prebuilts exist
        run: |
          if [ ! -d "ScaleCloudKit/prebuilt" ]; then
            echo "ERROR: ScaleCloudKit/prebuilt/ missing. Download ScaleCloudKit-prebuilt artifact first."
            exit 1
          fi
          if [ ! -d "ScaleCloudSign/prebuilt" ]; then
            echo "ERROR: ScaleCloudSign/prebuilt/ missing. Run ScaleCloudSign workflow first."
            exit 1
          fi
          if [ ! -d "ScaleCloudRenew/prebuilt" ]; then
            echo "ERROR: ScaleCloudRenew/prebuilt/ missing. Run ScaleCloudRenew workflow first."
            exit 1
          fi

      - name: Download GoogleService-Info.plist
        run: wget "https://raw.githubusercontent.com/firebase/quickstart-ios/master/mock-GoogleService-Info.plist" -O ScaleCloudApp/GoogleService-Info.plist

      - name: Build
        run: |
          cd ScaleCloudApp
          xcodebuild archive \
            -project ScaleCloudApp.xcodeproj \
            -scheme ScaleCloudApp \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/DerivedData/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Export IPA
        run: |
          mkdir -p ScaleCloudApp/build/ipa
          # Package the .app from the archive into an unsigned IPA
          cd ScaleCloudApp/build/App.xcarchive/Products/Applications
          mkdir -p Payload
          cp -R *.app Payload/
          zip -r ../../../ipa/ScaleCloudApp.ipa Payload
          rm -rf Payload

      - name: Stage artifact
        run: |
          mkdir -p /tmp/artifact/prebuilt
          cp ScaleCloudApp/build/ipa/ScaleCloudApp.ipa /tmp/artifact/prebuilt/

      - name: Push prebuilt to subrepo
        run: |
          cd ScaleCloudApp
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.SUBMODULES_PAT }}@github.com/poofygummy/ScaleCloudApp.git
          mkdir -p prebuilt
          cp build/ipa/ScaleCloudApp.ipa prebuilt/
          git add prebuilt/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update prebuilt [ci skip]"
          git push origin HEAD:main

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudApp-ipa
          path: /tmp/artifact/
          retention-days: 7

