
name: Build ScaleCloudApp

on:
  workflow_dispatch:
    inputs:
      build_extensions:
        description: 'Build app extensions (Share, Widget, File Provider, etc.) — requires 8 free Apple ID slots. Default false = 1 slot only.'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      build_extensions:
        description: 'Build app extensions'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_PAT }}
          lfs: true

      - name: Init required submodules
        run: git submodule update --init -- ScaleCloudApp ScaleCloudGo ScaleCloudKit ScaleCloudSign ScaleCloudRenew ScaleCloudBanner ScaleCloudDeps

      - name: Clean previous prebuilt
        run: rm -rf ScaleCloudApp/prebuilt

      - name: Check prebuilts exist
        run: |
          if [ ! -d "ScaleCloudKit/prebuilt" ]; then
            echo "ERROR: ScaleCloudKit/prebuilt/ missing. Download ScaleCloudKit-prebuilt artifact first."
            exit 1
          fi
          if [ ! -d "ScaleCloudSign/prebuilt" ]; then
            echo "ERROR: ScaleCloudSign/prebuilt/ missing. Run ScaleCloudSign workflow first."
            exit 1
          fi
          if [ ! -d "ScaleCloudRenew/prebuilt" ]; then
            echo "ERROR: ScaleCloudRenew/prebuilt/ missing. Run ScaleCloudRenew workflow first."
            exit 1
          fi

      - name: Download GoogleService-Info.plist
        run: wget "https://raw.githubusercontent.com/firebase/quickstart-ios/master/mock-GoogleService-Info.plist" -O ScaleCloudApp/GoogleService-Info.plist

      - name: Patch pbxproj to remove extensions (if build_extensions != true)
        if: ${{ inputs.build_extensions != true && github.event.inputs.build_extensions != 'true' }}
        run: |
          python3 - <<'EOF'
          import re

          path = "ScaleCloudApp/ScaleCloudApp.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              content = f.read()

          # Remove the 7 appex file references from the Embed Foundation Extensions files list
          appex_ids = [
              "F771E3EB20E2392E00AFB62D",  # File Provider Extension.appex
              "F749E4E91DC1FB38009BA2FD",  # Share.appex
              "F70716ED2987F81500E72C1D",  # File Provider Extension UI.appex
              "2C33C48623E2C475005F963B",  # Notification Service Extension.appex
              "F7C9739928F17131002C43E2",  # WidgetDashboardIntentHandler.appex
              "F7346E1C28B0EF5E006CE2D2",  # Widget.appex
              "F7C55C882FB5AEF7004A974F",  # Action Assistant.appex
          ]
          for uid in appex_ids:
              content = re.sub(r'\t\t\t\t' + uid + r' /\*.*?\*/,\n', '', content)

          with open(path, "w") as f:
              f.write(content)

          print("Patched: extension embed entries removed from pbxproj")
          EOF

      - name: Build
        run: |
          cd ScaleCloudApp
          xcodebuild archive \
            -project ScaleCloudApp.xcodeproj \
            -scheme ScaleCloudApp \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/DerivedData/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Export IPA
        run: |
          mkdir -p ScaleCloudApp/build/ipa
          # Package the .app from the archive into an unsigned IPA
          cd ScaleCloudApp/build/App.xcarchive/Products/Applications
          mkdir -p Payload
          cp -R *.app Payload/
          zip -r ../../../ipa/ScaleCloudApp.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudApp-ipa
          path: ScaleCloudApp/build/ipa/ScaleCloudApp.ipa
          retention-days: 7

