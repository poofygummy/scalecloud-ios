name: Build ScaleCloudApp

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check prebuilt exists
        run: |
          if [ ! -d "ScaleCloudGo/prebuilt" ]; then
            echo "ERROR: ScaleCloudGo/prebuilt/ missing. Run ScaleCloudGo workflow first."
            exit 1
          fi
          if [ ! -d "ScaleCloudKit/prebuilt" ]; then
            echo "ERROR: ScaleCloudKit/prebuilt/ missing. Run ScaleCloudKit workflow first."
            exit 1
          fi

      - name: Download GoogleService-Info.plist
        run: wget "https://raw.githubusercontent.com/firebase/quickstart-ios/master/mock-GoogleService-Info.plist" -O GoogleService-Info.plist

      - name: Generate project with xcodegen
        run: |
          brew install xcodegen
          cd ScaleCloudApp
          # Modify project.yml to remove ScaleCloudKit dependency and project reference
          sed '/target: ScaleCloudKit/d' project.yml > project_temp.yml
          sed -i.bak '/projectReferences:/,/path: ..\/ScaleCloudKit/d' project_temp.yml
          xcodegen generate --spec project_temp.yml
          rm project_temp.yml project_temp.yml.bak
          
          # Add Kit prebuilt as framework search path
          xcrun ruby -i -pe '$_.gsub!(/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/, "IPHONEOS_DEPLOYMENT_TARGET = 14.0;\n\t\t\t\tFRAMEWORK_SEARCH_PATHS = \"$(inherited) $(SRCROOT)/../ScaleCloudKit/prebuilt/**\";\n")' \
            ScaleCloudApp.xcodeproj/project.pbxproj

      - name: Build
        run: |
          cd ScaleCloudApp
          xcodebuild archive \
            -scheme ScaleCloudApp \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive

      - name: Extract app from archive
        run: |
          mkdir -p ScaleCloudApp/prebuilt
          # Copy the entire xcarchive for apps
          cp -R ScaleCloudApp/build/App.xcarchive ScaleCloudApp/prebuilt/

      - name: Upload prebuilt
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudApp-prebuilt
          path: ScaleCloudApp/prebuilt/
          retention-days: 7

