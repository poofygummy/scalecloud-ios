name: Build ScaleCloudApp

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true

      - name: Check prebuilts exist
        run: |
          if [ ! -d "ScaleCloudKit/prebuilt" ]; then
            echo "ERROR: ScaleCloudKit/prebuilt/ missing. Download ScaleCloudKit-prebuilt artifact first."
            exit 1
          fi
          if [ ! -d "ScaleCloudSign/prebuilt" ]; then
            echo "ERROR: ScaleCloudSign/prebuilt/ missing. Run ScaleCloudSign workflow first."
            exit 1
          fi
          if [ ! -d "ScaleCloudRenew/prebuilt" ]; then
            echo "ERROR: ScaleCloudRenew/prebuilt/ missing. Run ScaleCloudRenew workflow first."
            exit 1
          fi

      - name: Download GoogleService-Info.plist
        run: wget "https://raw.githubusercontent.com/firebase/quickstart-ios/master/mock-GoogleService-Info.plist" -O GoogleService-Info.plist

      - name: Generate project with xcodegen
        run: |
          curl -L https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip -o xcodegen.zip
          unzip xcodegen.zip
          sudo mv xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          cd ScaleCloudApp
          xcodegen generate

      - name: Clear SPM cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/repositories

      - name: Build
        run: |
          cd ScaleCloudApp
          xcodebuild archive \
            -scheme ScaleCloudApp \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/DerivedData/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload prebuilt
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudApp-prebuilt
          path: ScaleCloudApp/build/
          retention-days: 7

