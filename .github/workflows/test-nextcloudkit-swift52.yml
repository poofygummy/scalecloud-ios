name: Test Official NextcloudKit on Swift 5.9

on:
  workflow_dispatch:   # Only manual trigger from GitHub UI or gh CLI

jobs:
  build-swift59:
    # Option 1: Best compatibility for Swift 5.9 on ubuntu-24.04 runner
    # Uses the official Swift Docker image based on Ubuntu 22.04 (Jammy)
    runs-on: ubuntu-24.04
    container:
      image: swift:5.9-jammy   # Ubuntu 22.04 base + Swift 5.9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift Version
        run: swift --version

      - name: Clone and checkout the exact version of NextcloudKit used by the official nextcloud/ios app
        run: |
          # The official iOS app pins NextcloudKit to the 7.3.2 tag/branch
          git clone https://github.com/nextcloud/NextcloudKit.git /tmp/official-nextcloudkit
          cd /tmp/official-nextcloudkit
          git checkout 7.3.2
          echo "Checked out NextcloudKit version used by the official app:"
          git log --oneline -1

      - name: Build official NextcloudKit (7.3.2) with Swift 5.9
        run: |
          cd /tmp/official-nextcloudkit
          swift build 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift59-build-log
          path: /tmp/official-nextcloudkit/build.log
          retention-days: 14

  build-swift59-ubuntu22:
    # Option 2: Alternative - Use ubuntu-22.04 runner + setup-swift action
    # This is the most straightforward way to get Swift 5.9 on a GitHub runner in 2026
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Swift 5.9
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "5.9"

      - name: Swift Version
        run: swift --version

      - name: Clone official NextcloudKit
        run: |
          git clone --depth 1 https://github.com/nextcloud/NextcloudKit.git /tmp/official-nextcloudkit

      - name: Build official NextcloudKit with Swift 5.9
        run: |
          cd /tmp/official-nextcloudkit
          swift build 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift59-ubuntu22-build-log
          path: /tmp/official-nextcloudkit/build.log
          retention-days: 14
