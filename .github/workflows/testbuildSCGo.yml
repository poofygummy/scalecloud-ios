name: Build ScaleCloudGo

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_PAT }}
          lfs: false
      - name: Init ScaleCloudGo submodule only
        run: git submodule update --init -- ScaleCloudGo
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: 'ScaleCloudGo/go.sum'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build Go framework with gomobile
        working-directory: ScaleCloudGo
        run: |
          mkdir -p prebuilt
          gomobile bind -target=ios/arm64 -iosversion=14.0 -o prebuilt/ScaleCloudGo.xcframework .

      - name: Fix Info.plist (CFBundleIdentifier + MinimumOSVersion)
        run: |
          PLIST=ScaleCloudGo/prebuilt/ScaleCloudGo.xcframework/ios-arm64/ScaleCloudGo.framework/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.scalecloud.ScaleCloudGo" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 15.0" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.scalecloud.ScaleCloudGo" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" "$PLIST"
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          echo "MinimumOSVersion: $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PLIST")"

      - name: Stage artifact
        run: |
          mkdir -p /tmp/artifact/prebuilt
          cp -R ScaleCloudGo/prebuilt/ /tmp/artifact/prebuilt/

      - name: Push prebuilt to subrepo
        run: |
          cd ScaleCloudGo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.SUBMODULES_PAT }}@github.com/poofygummy/ScaleCloudGo.git
          git add prebuilt/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update prebuilt [ci skip]"
          git push origin HEAD:main

      - name: Update monorepo submodule pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.SUBMODULES_PAT }}@github.com/poofygummy/scalecloud-ios.git
          git add ScaleCloudGo
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update ScaleCloudGo submodule pointer [ci skip]"
          git push origin HEAD:main

      - name: Upload prebuilt
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudGo-prebuilt
          path: /tmp/artifact/
          retention-days: 7

      - name: Trigger next build (ScaleCloudKit)
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.SUBMODULES_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/poofygummy/scalecloud-ios/actions/workflows/testbuildSCKit.yml/dispatches \
            -d '{"ref":"main"}'

