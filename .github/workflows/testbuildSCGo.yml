name: Build ScaleCloudGo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: 'ScaleCloudGo/go.sum'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build Go framework with gomobile
        working-directory: ScaleCloudGo
        run: |
          mkdir -p prebuilt
          gomobile bind -target=ios -o prebuilt/ScaleCloudGo.xcframework .

      - name: Upload prebuilt
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudGo-prebuilt
          path: ScaleCloudGo/prebuilt/
          retention-days: 7

