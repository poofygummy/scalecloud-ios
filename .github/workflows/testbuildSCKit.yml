name: Build ScaleCloudKit

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Init required submodules
        run: git submodule update --init -- ScaleCloudGo ScaleCloudKit

      - name: Check Go prebuilt exists
        run: |
          if [ ! -d "ScaleCloudGo/prebuilt" ]; then
            echo "ERROR: ScaleCloudGo/prebuilt/ missing. Download ScaleCloudGo-prebuilt artifact first."
            exit 1
          fi
      - name: Generate Xcode project with xcodegen
        run: |
      - name: Install xcodegen
        run: |
          curl -L https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip -o xcodegen.zip
          unzip xcodegen.zip
          sudo mv xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          cd ScaleCloudKit
          xcodegen generate

      - name: Build and extract framework
        run: |
          cd ScaleCloudKit
          mkdir -p prebuilt
          WS=${{ github.workspace }}
          xcodebuild build \
            -scheme ScaleCloudKit \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            DYLIB_INSTALL_NAME_BASE=@rpath \
            FRAMEWORK_SEARCH_PATHS="$WS/ScaleCloudGo/prebuilt"
          
          # Copy framework from build products
          FW=$(find build/Build/Products -type d -name "ScaleCloudKit.framework" | head -1)
          if [ -z "$FW" ]; then
            echo "ERROR: ScaleCloudKit.framework not found in build products"
            find build -name "*.framework" -o -name "*.a"
            exit 1
          fi
          echo "Found framework at: $FW"
          cp -R "$FW" prebuilt/

          # Inject Info.plist (xcodebuild doesn't generate one for this project)
          PLIST=prebuilt/ScaleCloudKit.framework/Info.plist
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIdentifier string com.scalecloud.ScaleCloudKit" \
            -c "Add :CFBundleName string ScaleCloudKit" \
            -c "Add :CFBundleExecutable string ScaleCloudKit" \
            -c "Add :CFBundlePackageType string FMWK" \
            -c "Add :CFBundleShortVersionString string 1.0" \
            -c "Add :CFBundleVersion string 1" \
            -c "Add :MinimumOSVersion string 15.0" \
            -c "Add :CFBundleSupportedPlatforms array" \
            -c "Add :CFBundleSupportedPlatforms:0 string iPhoneOS" \
            "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleIdentifier com.scalecloud.ScaleCloudKit" \
            -c "Set :CFBundleName ScaleCloudKit" \
            -c "Set :CFBundleExecutable ScaleCloudKit" \
            -c "Set :CFBundlePackageType FMWK" \
            -c "Set :CFBundleShortVersionString 1.0" \
            -c "Set :CFBundleVersion 1" \
            -c "Set :MinimumOSVersion 15.0" \
            "$PLIST"
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"

      - name: Upload prebuilt
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudKit-prebuilt
          path: |
            ScaleCloudKit/prebuilt/
            ScaleCloudKit/ScaleCloudKit.xcodeproj/
          retention-days: 7
          
