name: Build ScaleCloudKit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: 'ScaleCloudGo/go.sum'

      - name: Provision tools
        run: |
          brew install xcodegen
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      # Generate prerequisite first
      - name: Generate ScaleCloudGo project
        working-directory: ScaleCloudGo
        run: xcodegen generate

      # Now generate from ROOT so workspace + projectReferences resolve correctly
      - name: Generate workspace + ScaleCloudKit
        run: xcodegen generate --spec workspace.yml

      - name: Build ScaleCloudKit (via workspace)
        run: |
          xcodebuild archive \
            -workspace ScaleCloudUniversal.xcworkspace \
            -scheme ScaleCloudKit \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ScaleCloudKit.xcarchive"

      - name: Upload artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudKit-xcarchive
          path: ScaleCloudKit/build/ScaleCloudKit.xcarchive
          retention-days: 1
          
