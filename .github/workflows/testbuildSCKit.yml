name: Build ScaleCloudKit iOS Framework

on:
  workflow_dispatch:

jobs:
  build-kit:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Provision
        run: |
          brew install xcodegen
          go install golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Generate Projects
        run: |
          # We must generate the dependency first so the reference is valid
          xcodegen --spec ScaleCloudGo/project.yml
          xcodegen --spec ScaleCloudKit/project.yml

      - name: Execute Build
        run: |
          xcodebuild archive \
            -project ScaleCloudKit/ScaleCloudKit.xcodeproj \
            -scheme ScaleCloudKit \
            -destination 'generic/platform=iOS' \
            -archivePath "ScaleCloudKit/build/ScaleCloudKit.xcarchive"

      - name: Upload Output
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudKit-xcarchive
          path: ScaleCloudKit/build/ScaleCloudKit.xcarchive
