name: Build ScaleCloudKit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Go prebuilt exists
        run: |
          if [ ! -d "ScaleCloudGo/prebuilt" ]; then
            echo "ERROR: ScaleCloudGo/prebuilt/ missing. Download ScaleCloudGo-prebuilt artifact first."
            exit 1
          fi

      - name: Generate Xcode project with xcodegen
        run: |
          brew install xcodegen
          cd ScaleCloudKit
          # Modify project.yml to link prebuilt Go instead of source Go
          sed '/target: ScaleCloudGo/d' project.yml > project_temp.yml
          sed -i.bak '/projectReferences:/,/path: ..\ScaleCloudGo/d' project_temp.yml
          xcodegen generate --spec project_temp.yml
          rm project_temp.yml project_temp.yml.bak
          
          # Add Go prebuilt as framework search path
          xcrun ruby -i -pe '$_.gsub!(/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/, "IPHONEOS_DEPLOYMENT_TARGET = 14.0;\n\t\t\t\tFRAMEWORK_SEARCH_PATHS = \"$(inherited) $(SRCROOT)/../ScaleCloudGo/prebuilt/**\";\n")' \
            ScaleCloudKit.xcodeproj/project.pbxproj

      - name: Build
        run: |
          cd ScaleCloudKit
          xcodebuild archive \
            -scheme ScaleCloudKit \
            -destination 'generic/platform=iOS' \
            -archivePath build/Kit.xcarchive

      - name: Extract framework from archive
        run: |
          mkdir -p ScaleCloudKit/prebuilt
          # Framework is in the IntermediateBuildFilesPath/UninstalledProducts for framework archives
          FW=$(find ScaleCloudKit/build/Kit.xcarchive -path "*/IntermediateBuildFilesPath/UninstalledProducts/*/ScaleCloudKit.framework" | head -1)
          if [ -z "$FW" ]; then
            echo "ERROR: ScaleCloudKit.framework not found in expected location"
            echo "Archive structure:"
            find ScaleCloudKit/build/Kit.xcarchive -name "*.framework" | head -20
            exit 1
          fi
          echo "Found framework at: $FW"
          cp -R "$FW" ScaleCloudKit/prebuilt/

      - name: Upload prebuilt
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudKit-prebuilt
          path: ScaleCloudKit/prebuilt/
          retention-days: 7
          
