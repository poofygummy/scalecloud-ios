name: Build ScaleCloudSign T

on:
  workflow_dispatch:

jobs:
  build:
    # Changed from macos-26 to macos-14 to get native access to the older SDKs
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Go and Kit prebuilt exist
        run: |
          if [ ! -d "ScaleCloudGo/prebuilt" ]; then
            echo "ERROR: ScaleCloudGo/prebuilt/ missing. Run ScaleCloudGo workflow first."
            exit 1
          fi
          if [ ! -d "ScaleCloudKit/prebuilt" ]; then
            echo "ERROR: ScaleCloudKit/prebuilt/ missing. Run ScaleCloudKit workflow first."
            exit 1
          fi

      # Explicitly forces the machine runner to use Xcode 15.4 toolchain
      # This handles the native corecrypto optional pointers exactly like SideStore's upstream
      - name: Select CoreCrypto Compatible Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Generate Xcode project with xcodegen
        run: |
          brew install xcodegen
          cd ScaleCloudSign
          # Nuke the old project folder to clear the cached format metadata
          rm -rf ScaleCloudSign.xcodeproj
          xcodegen generate

      - name: Build and extract framework
        run: |
          cd ScaleCloudSign
          mkdir -p prebuilt
          xcodebuild build \
            -scheme ScaleCloudSign \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES
          
          # Copy framework from build products
          FW=$(find build/Build/Products -type d -name "ScaleCloudSign.framework" | head -1)
          if [ -z "$FW" ]; then
            echo "ERROR: ScaleCloudSign.framework not found in build products"
            find build -name "*.framework" -o -name "*.a"
            exit 1
          fi
          echo "Found framework at: $FW"
          cp -R "$FW" prebuilt/

      - name: Upload prebuilt
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudSign-prebuilt
          path: |
            ScaleCloudSign/prebuilt/
            ScaleCloudSign/ScaleCloudSign.xcodeproj/
          retention-days: 7
