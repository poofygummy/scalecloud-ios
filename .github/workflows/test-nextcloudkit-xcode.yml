name: Test Official NextcloudKit on macOS + Xcode (5.9)

on:
  workflow_dispatch:   # Only manual trigger

jobs:
  build-xcode:
    runs-on: macos-14   # Apple Silicon runner with recent Xcode
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout NextcloudKit at the exact version used by the official app (7.3.2)
        run: |
          # Clear any pre-configured credential helpers that can break public clones on macOS runners
          git config --global credential.helper ""
          git config --global --unset-all url.https://github.com/.insteadOf || true

          git clone https://github.com/nextcloud/NextcloudKit.git
          cd NextcloudKit
          git checkout 7.3.2
          echo "Checked out NextcloudKit version:"
          git log --oneline -1

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build NextcloudKit with Xcode
        run: |
          cd NextcloudKit
          
          # Clean any previous generated project to avoid conflicts
          rm -rf XcodeProject

          # Generate Xcode project into a clearly separate directory
          # (not named "NextcloudKit") to prevent "destinationPath already exists" errors
          swift package generate-xcodeproj --destination-path ./GeneratedXcodeProject
          
          # Build using the generated project in the new location
          xcodebuild \
            -project ./GeneratedXcodeProject/NextcloudKit.xcodeproj \
            -scheme NextcloudKit \
            -destination 'generic/platform=iOS' \
            clean build \
            | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-5.9-build-log
          path: NextcloudKit/build.log
          retention-days: 14
