name: Build NextcloudKit iOS framework

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    branches:
      - main
      - develop
  workflow_dispatch: {}

jobs:
  build-my-modified-xcode:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build my modified NextcloudKit (local fork) with Xcode
        run: |
          set -e
          cd NextcloudKit

          # Resolve SPM dependencies
          xcodebuild -resolvePackageDependencies \
            -scheme NextcloudKit \
            -destination 'generic/platform=iOS'

          # Build into an explicit DerivedData folder so we can reliably find the built framework
          DERIVED_DATA="$PWD/build/DerivedData"
          mkdir -p "$DERIVED_DATA"

          xcodebuild \
            -scheme NextcloudKit \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            clean build \
            | tee build.log

      - name: Package the built NextcloudKit framework
        run: |
          # Find the built framework in the explicit DerivedData we used
          DERIVED_DATA="$PWD/NextcloudKit/build/DerivedData"
          # Look in the expected Build/Products locations
          FRAMEWORK_PATH=$(find "$DERIVED_DATA/Build/Products" -name "NextcloudKit.framework" -type d | head -1)

          if [ -d "$FRAMEWORK_PATH" ]; then
            mkdir -p ./artifacts
            cp -R "$FRAMEWORK_PATH" ./artifacts/
            echo "NextcloudKit.framework copied from: $FRAMEWORK_PATH"
            ls -la ./artifacts/
            # Zip the framework for reliable artifact upload
            cd artifacts
            zip -r NextcloudKit.framework.zip NextcloudKit.framework
            cd -
          else
            echo "Could not find NextcloudKit.framework in DerivedData"
            echo "Searched: $DERIVED_DATA/Build/Products"
            find "$DERIVED_DATA" -name "*NextcloudKit*" -type d | head -20
            exit 1
          fi

      - name: Upload NextcloudKit Framework (for download)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NextcloudKit-Framework
          path: artifacts/NextcloudKit.framework.zip
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-modified-xcode-5.9-build-log
          path: NextcloudKit/build.log
          retention-days: 14
