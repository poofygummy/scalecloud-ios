name: Build NextcloudKit iOS framework

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    branches:
      - main
      - develop
  workflow_dispatch: {}

jobs:
  build-my-modified-xcode:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build my modified NextcloudKit (local fork) with Xcode
        run: |
          set -e
          cd NextcloudKit

          # Resolve SPM dependencies
          xcodebuild -resolvePackageDependencies \
            -scheme NextcloudKit \
            -destination 'generic/platform=iOS'

          # Create an xcarchive for a deterministic product path
          ARCHIVE_PATH="$PWD/build/NextcloudKit.xcarchive"
          mkdir -p "$(dirname "$ARCHIVE_PATH")"

          xcodebuild archive \
            -scheme NextcloudKit \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            | tee build.log || true

      - name: Package the built NextcloudKit framework
        run: |
          # Primary location: archive Products path
          ARCHIVE_PATH="$PWD/build/NextcloudKit.xcarchive"
          ARCHIVE_FRAMEWORK="$ARCHIVE_PATH/Products/Library/Frameworks/NextcloudKit.framework"

          FRAMEWORK_PATH=""
          if [ -d "$ARCHIVE_FRAMEWORK" ]; then
            FRAMEWORK_PATH="$ARCHIVE_FRAMEWORK"
          else
            # Fallback: look into DerivedData Build/Products
            DERIVED_DATA="$PWD/build/DerivedData"
            FRAMEWORK_PATH=$(find "$DERIVED_DATA/Build/Products" -name "NextcloudKit.framework" -type d | head -1 || true)
          fi

          if [ -n "$FRAMEWORK_PATH" ] && [ -d "$FRAMEWORK_PATH" ]; then
            mkdir -p ./artifacts
            cp -R "$FRAMEWORK_PATH" ./artifacts/
            echo "NextcloudKit.framework copied from: $FRAMEWORK_PATH"
            ls -la ./artifacts/
            # Zip the framework for reliable artifact upload
            cd artifacts
            zip -r NextcloudKit.framework.zip NextcloudKit.framework
            cd -
          else
            echo "Could not find NextcloudKit.framework in archive or DerivedData"
            echo "Checked: $ARCHIVE_FRAMEWORK"
            echo "Searched: $PWD/build/DerivedData/Build/Products"
            find "$PWD" -name "*NextcloudKit*" -type d | head -40
            exit 1
          fi

      - name: Upload NextcloudKit Framework (for download)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NextcloudKit-Framework
          path: artifacts/NextcloudKit.framework.zip
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-modified-xcode-5.9-build-log
          path: NextcloudKit/build.log
          retention-days: 14
