name: Build Selected Layer (Standalone)

on:
  workflow_dispatch:
    inputs:
      layer:
        description: 'Layer to build'
        required: true
        default: 'wrap'
        type: choice
        options:
          - go
          - kit
          - app
          - wrap

jobs:
  build:
    runs-on: macos-15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go environment (only for go layer)
        if: inputs.layer == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: 'ScaleCloudGo/go.sum'

      - name: Install gomobile (only for go layer)
        if: inputs.layer == 'go'
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Install Tuist via mise
        uses: jdx/mise-action@v2

      - name: Verify prebuilt dependencies exist
        run: |
          echo "Checking for prebuilt dependencies..."
          if [ "${{ inputs.layer }}" == "kit" ]; then
            if [ ! -d "ScaleCloudGo/prebuilt" ]; then
              echo "ERROR: ScaleCloudGo/prebuilt not found!"
              echo "Please build and commit ScaleCloudGo first."
              exit 1
            fi
            echo "✓ Found prebuilt ScaleCloudGo"
          elif [ "${{ inputs.layer }}" == "app" ]; then
            if [ ! -d "ScaleCloudGo/prebuilt" ] || [ ! -d "ScaleCloudKit/prebuilt" ]; then
              echo "ERROR: prebuilt dependencies not found!"
              echo "Please build and commit ScaleCloudGo and ScaleCloudKit first."
              exit 1
            fi
            echo "✓ Found prebuilt ScaleCloudGo and ScaleCloudKit"
          elif [ "${{ inputs.layer }}" == "wrap" ]; then
            if [ ! -d "ScaleCloudGo/prebuilt" ] || [ ! -d "ScaleCloudKit/prebuilt" ] || [ ! -d "ScaleCloudApp/prebuilt" ]; then
              echo "ERROR: prebuilt dependencies not found!"
              echo "Please build and commit all lower layers first."
              exit 1
            fi
            echo "✓ Found all prebuilt dependencies"
          fi

      - name: Build ScaleCloudGo
        if: inputs.layer == 'go'
        run: |
          echo "Building ScaleCloudGo framework..."
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd ScaleCloudGo
          mkdir -p prebuilt
          gomobile bind -target=ios -o prebuilt/ScaleCloudGo.xcframework .

      - name: Build ScaleCloudKit
        if: inputs.layer == 'kit'
        run: |
          echo "Using prebuilt ScaleCloudGo from ScaleCloudGo/prebuilt/"
          # Remove existing prebuilt so we actually build it fresh
          rm -rf ScaleCloudKit/prebuilt
          tuist install
          tuist generate
          xcodebuild build \
            -workspace ScaleCloud.xcworkspace \
            -scheme ScaleCloudKit \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build \
            -configuration Release \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO
          echo "Copying build output to ScaleCloudKit/prebuilt/"
          mkdir -p ScaleCloudKit/prebuilt
          cp -R .build/Build/Products/Release-iphoneos/ScaleCloudKit.framework ScaleCloudKit/prebuilt/

      - name: Build ScaleCloudApp
        if: inputs.layer == 'app'
        run: |
          echo "Using prebuilt dependencies from ScaleCloudGo/prebuilt/ and ScaleCloudKit/prebuilt/"
          # Remove existing prebuilt so we actually build it fresh
          rm -rf ScaleCloudApp/prebuilt
          tuist install
          tuist generate
          xcodebuild build \
            -workspace ScaleCloud.xcworkspace \
            -scheme ScaleCloudApp \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build \
            -configuration Release \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO
          echo "Copying build output to ScaleCloudApp/prebuilt/"
          mkdir -p ScaleCloudApp/prebuilt
          cp -R .build/Build/Products/Release-iphoneos/ScaleCloudApp.app ScaleCloudApp/prebuilt/

      - name: Build ScaleCloudWrap
        if: inputs.layer == 'wrap'
        run: |
          echo "Using all prebuilt dependencies from their respective directories"
          # Remove existing prebuilt so we actually build it fresh
          rm -rf ScaleCloudWrap/prebuilt
          tuist install
          tuist generate
          xcodebuild build \
            -workspace ScaleCloud.xcworkspace \
            -scheme ScaleCloudWrap \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build \
            -configuration Release \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO
          echo "Copying build output to ScaleCloudWrap/prebuilt/"
          mkdir -p ScaleCloudWrap/prebuilt
          cp -R .build/Build/Products/Release-iphoneos/ScaleCloudWrap.* ScaleCloudWrap/prebuilt/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.layer }}-build
          path: |
            ScaleCloudGo/prebuilt/
            ScaleCloudKit/prebuilt/
            ScaleCloudApp/prebuilt/
            ScaleCloudWrap/prebuilt/
          retention-days: 7

      - name: Display commit instructions
        run: |
          echo ""
          echo "=========================================="
          echo "Build completed for layer: ${{ inputs.layer }}"
          echo "=========================================="
          echo ""
          echo "To commit this prebuilt artifact:"
          echo "1. Download the '${{ inputs.layer }}-build' artifact from GitHub Actions"
          echo "2. Extract it to your local repo root"
          if [ "${{ inputs.layer }}" == "go" ]; then
            echo "3. The prebuilt files will be in: ScaleCloudGo/prebuilt/"
          elif [ "${{ inputs.layer }}" == "kit" ]; then
            echo "3. The prebuilt files will be in: ScaleCloudKit/prebuilt/"
          elif [ "${{ inputs.layer }}" == "app" ]; then
            echo "3. The prebuilt files will be in: ScaleCloudApp/prebuilt/"
          else
            echo "3. The prebuilt files will be in: ScaleCloudWrap/prebuilt/"
          fi
          echo "4. git add ScaleCloud*/prebuilt/"
          echo "5. git commit -m 'Update prebuilt ${{ inputs.layer }} layer'"
          echo "6. git push"
          echo ""
          echo "Once committed, you can build the next layer up."
          echo ""
