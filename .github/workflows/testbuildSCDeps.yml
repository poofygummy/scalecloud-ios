name: Build ScaleCloudDeps

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_PAT }}
          lfs: false

      - name: Init ScaleCloudDeps submodule
        run: git submodule update --init -- ScaleCloudDeps

      - name: Clean previous prebuilt
        run: rm -rf ScaleCloudDeps/prebuilt/*.xcframework

      - name: Resolve packages
        run: |
          cd ScaleCloudDeps
          swift package resolve
          echo "=== Checkouts ==="
          ls .build/checkouts/

      - name: Build each upstream package directly
        shell: bash
        run: |
          cd ScaleCloudDeps
          mkdir -p prebuilt

          # Map dep name -> exact scheme name found in each checkout
          get_scheme() {
            case "$1" in
              Alamofire)       echo "Alamofire iOS" ;;
              SwiftyJSON)      echo "SwiftyJSON iOS" ;;
              SwiftyXMLParser) echo "SwiftyXMLParser" ;;
              KeychainAccess)  echo "KeychainAccess" ;;
              Starscream)      echo "Starscream" ;;
              ZIPFoundation)   echo "ZIPFoundation" ;;
              Nuke)            echo "Nuke" ;;
              *) echo "UNKNOWN" ;;
            esac
          }

          # Packages built via xcodebuild from their own checkout
          XCODE_DEPS="Alamofire SwiftyJSON SwiftyXMLParser KeychainAccess Starscream ZIPFoundation Nuke"

          for DEP in $XCODE_DEPS; do
            echo "=== Building $DEP ==="

            CHECKOUT=$(find .build/checkouts -maxdepth 1 -type d -iname "${DEP}*" | head -1)
            if [ -z "$CHECKOUT" ]; then
              echo "ERROR: no checkout found for $DEP"
              ls .build/checkouts/
              exit 1
            fi
            echo "Checkout: $CHECKOUT"

            SCHEME=$(get_scheme "$DEP")
            echo "Scheme: $SCHEME"

            pushd "$CHECKOUT"
            xcodebuild build \
              -scheme "$SCHEME" \
              -destination 'generic/platform=iOS' \
              -sdk iphoneos \
              -derivedDataPath "$(pwd)/build" \
              BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
              SKIP_INSTALL=NO
            popd

            echo "=== Frameworks produced ==="
            find "$CHECKOUT/build/Build/Products" -type d -name "*.framework" | sort

            FW=$(find "$CHECKOUT/build/Build/Products" -type d -name "${DEP}.framework" | head -1)
            if [ -z "$FW" ]; then
              echo "ERROR: ${DEP}.framework not found"
              exit 1
            fi
            echo "Found: $FW"

            xcodebuild -create-xcframework \
              -framework "$FW" \
              -output "prebuilt/${DEP}.xcframework"

            echo "=== Done: prebuilt/${DEP}.xcframework ==="
          done

          # SemanticVersion has no xcodeproj — build via SPM from this package,
          # then manually wrap the .o + .swiftmodule into a framework bundle.
          echo "=== Building SemanticVersion (SPM) ==="
          swift build \
            -c release \
            --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            --destination 'generic/platform=iOS' \
            --target SemanticVersion \
            --scratch-path .build/spm-semver

          SEMVER_O=$(find .build/spm-semver -name "SemanticVersion.o" | head -1)
          SEMVER_SM=$(find .build/spm-semver -name "SemanticVersion.swiftmodule" -type d | head -1)
          echo "SemanticVersion.o: $SEMVER_O"
          echo "SemanticVersion.swiftmodule: $SEMVER_SM"

          # Build a static framework bundle manually
          FW_DIR="/tmp/SemanticVersion.framework"
          rm -rf "$FW_DIR"
          mkdir -p "$FW_DIR/Modules"

          # Static archive from the .o
          ar rcs "$FW_DIR/SemanticVersion" "$SEMVER_O"

          # Copy swiftmodule
          cp -r "$SEMVER_SM" "$FW_DIR/Modules/SemanticVersion.swiftmodule"

          # Minimal Info.plist
          cat > "$FW_DIR/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>SemanticVersion</string>
            <key>CFBundleIdentifier</key><string>com.scalecloudeps.SemanticVersion</string>
            <key>CFBundleName</key><string>SemanticVersion</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleShortVersionString</key><string>0.3.8</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>MinimumOSVersion</key><string>14.0</string>
          </dict></plist>
          EOF

          xcodebuild -create-xcframework \
            -framework "$FW_DIR" \
            -output "prebuilt/SemanticVersion.xcframework"

          echo "=== Done: prebuilt/SemanticVersion.xcframework ==="

      - name: List prebuilt output
        run: ls -la ScaleCloudDeps/prebuilt/

      - name: Push prebuilt to subrepo
        run: |
          cd ScaleCloudDeps
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.SUBMODULES_PAT }}@github.com/poofygummy/ScaleCloudDeps.git
          git add prebuilt/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update prebuilt [ci skip]"
          git push origin HEAD:main

      - name: Update monorepo submodule pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.SUBMODULES_PAT }}@github.com/poofygummy/scalecloud-ios.git
          git add ScaleCloudDeps
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update ScaleCloudDeps submodule pointer [ci skip]"
          git push origin HEAD:main

      - name: Upload prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudDeps-prebuilt
          path: ScaleCloudDeps/prebuilt/
          retention-days: 7
