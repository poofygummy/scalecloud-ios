name: Build ScaleCloudDeps

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_PAT }}
          lfs: false

      - name: Init ScaleCloudDeps submodule
        run: git submodule update --init -- ScaleCloudDeps

      - name: Clean previous prebuilt
        run: rm -rf ScaleCloudDeps/prebuilt/*.xcframework

      - name: Resolve packages and show schemes
        run: |
          cd ScaleCloudDeps
          # swift package resolve fetches all dependencies and creates
          # .swiftpm/xcode/package.xcworkspace which xcodebuild can use.
          swift package resolve
          echo "=== Schemes available ==="
          xcodebuild -list \
            -workspace .swiftpm/xcode/package.xcworkspace 2>&1

      - name: Build each upstream package directly
        run: |
          cd ScaleCloudDeps
          mkdir -p prebuilt

          DEPS="Alamofire SwiftyJSON SwiftyXMLParser KeychainAccess Starscream ZIPFoundation Nuke SemanticVersion"

          for DEP in $DEPS; do
            echo "=== Building upstream $DEP ==="
            xcodebuild build \
              -scheme "$DEP" \
              -workspace .swiftpm/xcode/package.xcworkspace \
              -destination 'generic/platform=iOS' \
              -sdk iphoneos \
              -derivedDataPath build \
              BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
              SKIP_INSTALL=NO

            echo "=== All frameworks after $DEP ==="
            find build/Build/Products -type d -name "*.framework" | sort

            FW=$(find build/Build/Products -type d -name "${DEP}.framework" | head -1)
            if [ -z "$FW" ]; then
              echo "ERROR: ${DEP}.framework not found"
              exit 1
            fi
            echo "Found: $FW"

            xcodebuild -create-xcframework \
              -framework "$FW" \
              -output "prebuilt/${DEP}.xcframework"

            echo "=== Done: prebuilt/${DEP}.xcframework ==="
          done

      - name: List prebuilt output
        run: ls -la ScaleCloudDeps/prebuilt/

      - name: Push prebuilt to subrepo
        run: |
          cd ScaleCloudDeps
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.SUBMODULES_PAT }}@github.com/poofygummy/ScaleCloudDeps.git
          git add prebuilt/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update prebuilt [ci skip]"
          git push origin HEAD:main

      - name: Update monorepo submodule pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.SUBMODULES_PAT }}@github.com/poofygummy/scalecloud-ios.git
          git add ScaleCloudDeps
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update ScaleCloudDeps submodule pointer [ci skip]"
          git push origin HEAD:main

      - name: Upload prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudDeps-prebuilt
          path: ScaleCloudDeps/prebuilt/
          retention-days: 7
