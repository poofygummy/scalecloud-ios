name: Build ScaleCloudDeps

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_PAT }}
          lfs: false

      - name: Init ScaleCloudDeps submodule
        run: git submodule update --init -- ScaleCloudDeps

      - name: Clean previous prebuilt
        run: rm -rf ScaleCloudDeps/prebuilt/*.xcframework

      - name: Resolve packages
        run: |
          cd ScaleCloudDeps
          swift package resolve
          echo "=== Checkouts ==="
          ls .build/checkouts/

      - name: Build each upstream package directly
        shell: bash
        run: |
          cd ScaleCloudDeps
          mkdir -p prebuilt

          # Map dep name -> exact scheme name found in each checkout
          get_scheme() {
            case "$1" in
              Alamofire)       echo "Alamofire iOS" ;;
              SwiftyJSON)      echo "SwiftyJSON iOS" ;;
              SwiftyXMLParser) echo "SwiftyXMLParser" ;;
              KeychainAccess)  echo "KeychainAccess" ;;
              Starscream)      echo "Starscream" ;;
              ZIPFoundation)   echo "ZIPFoundation" ;;
              Nuke)            echo "Nuke" ;;
              *) echo "UNKNOWN" ;;
            esac
          }

          # Packages built via xcodebuild from their own checkout
          XCODE_DEPS="Alamofire SwiftyJSON SwiftyXMLParser KeychainAccess Starscream ZIPFoundation Nuke"

          for DEP in $XCODE_DEPS; do
            echo "=== Building $DEP ==="

            CHECKOUT=$(find .build/checkouts -maxdepth 1 -type d -iname "${DEP}*" | head -1)
            if [ -z "$CHECKOUT" ]; then
              echo "ERROR: no checkout found for $DEP"
              ls .build/checkouts/
              exit 1
            fi
            echo "Checkout: $CHECKOUT"

            SCHEME=$(get_scheme "$DEP")
            echo "Scheme: $SCHEME"

            pushd "$CHECKOUT"
            xcodebuild build \
              -scheme "$SCHEME" \
              -destination 'generic/platform=iOS' \
              -sdk iphoneos \
              -derivedDataPath "$(pwd)/build" \
              BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
              SKIP_INSTALL=NO
            popd

            echo "=== Frameworks produced ==="
            find "$CHECKOUT/build/Build/Products" -type d -name "*.framework" | sort

            FW=$(find "$CHECKOUT/build/Build/Products" -type d -name "${DEP}.framework" | head -1)
            if [ -z "$FW" ]; then
              echo "ERROR: ${DEP}.framework not found"
              exit 1
            fi
            echo "Found: $FW"

            xcodebuild -create-xcframework \
              -framework "$FW" \
              -output "prebuilt/${DEP}.xcframework"

            echo "=== Done: prebuilt/${DEP}.xcframework ==="
          done

          # SemanticVersion has no xcodeproj — list available schemes for diagnostics
          echo "=== SemanticVersion: listing schemes ==="
          SEMVER_CHECKOUT=$(find .build/checkouts -maxdepth 1 -type d -iname "SemanticVersion*" | head -1)
          pushd "$SEMVER_CHECKOUT"
          xcodebuild -list 2>&1 || true
          echo "=== Contents ==="
          ls -la
          popd

      - name: List prebuilt output
        run: ls -la ScaleCloudDeps/prebuilt/

      - name: Push prebuilt to subrepo
        run: |
          cd ScaleCloudDeps
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.SUBMODULES_PAT }}@github.com/poofygummy/ScaleCloudDeps.git
          git add prebuilt/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update prebuilt [ci skip]"
          git push origin HEAD:main

      - name: Update monorepo submodule pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.SUBMODULES_PAT }}@github.com/poofygummy/scalecloud-ios.git
          git add ScaleCloudDeps
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update ScaleCloudDeps submodule pointer [ci skip]"
          git push origin HEAD:main

      - name: Upload prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScaleCloudDeps-prebuilt
          path: ScaleCloudDeps/prebuilt/
          retention-days: 7
